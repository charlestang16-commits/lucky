<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇者運財分析系統</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --black: #111;
            --dark-grey: #222;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--black);
            color: var(--text-color);
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3 {
            color: var(--gold);
            text-shadow: 1px 1px 2px #000;
            margin: 5px 0;
            text-align: center;
        }

        /* 頂部結果顯示區 */
        #result-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(145deg, #1a1a1a, #000);
            border: 2px solid var(--gold);
            border-radius: 10px;
            width: 95%;
            max-width: 800px;
            min-height: 150px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #result-title {
            font-size: 1.2rem;
            color: var(--gold-light);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--gold-dark);
            width: 100%;
            padding-bottom: 5px;
        }

        #result-content {
            font-size: 1.1rem;
            line-height: 1.6;
            width: 100%;
        }

        /* 標籤頁切換 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 30px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            border-radius: 5px;
        }

        .tab-btn.active {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark));
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px var(--gold);
        }

        /* 內容區塊 */
        .content-section {
            display: none;
            width: 95%;
            max-width: 800px;
            background: var(--dark-grey);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 輸入區 */
        .input-group {
            margin-bottom: 20px;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        input[type="text"], input[type="number"] {
            background: #222;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            width: 200px;
            text-align: center;
        }

        /* 按鈕網格 */
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .action-btn {
            background: linear-gradient(145deg, #333, #111);
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            padding: 15px 5px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .action-btn:hover {
            background: linear-gradient(145deg, var(--gold-dark), #333);
            color: #fff;
            box-shadow: 0 0 8px var(--gold-dark);
        }

        .action-btn span {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* 六合彩球樣式 */
        .ball {
            display: inline-block;
            width: 35px;
            height: 35px;
            line-height: 35px;
            border-radius: 50%;
            text-align: center;
            font-weight: bold;
            color: white;
            margin: 3px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5);
        }
        .ball.red { background: radial-gradient(circle at 10px 10px, #ff4d4d, #990000); border: 1px solid #ff9999; }
        .ball.green { background: radial-gradient(circle at 10px 10px, #4dff4d, #006600); border: 1px solid #99ff99; }
        .ball.blue { background: radial-gradient(circle at 10px 10px, #4d4dff, #000099); border: 1px solid #9999ff; }

        /* 賽馬樣式 */
        .horse-icon {
            display: inline-block;
            background: var(--gold);
            color: black;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin: 2px;
            border: 1px solid #fff;
        }
        .race-tag {
            color: var(--gold-light);
            font-weight: bold;
            margin-top: 10px;
            display: block;
            border-bottom: 1px dashed #555;
        }

        /* 子分類標題 */
        .sub-header {
            width: 100%;
            border-bottom: 1px solid #444;
            color: #888;
            margin: 15px 0 10px 0;
            padding-bottom: 5px;
            grid-column: 1 / -1;
        }

    </style>
</head>
<body>

    <h1>皇者運財分析系統</h1>
    <div style="color: var(--gold-dark); font-size: 0.9rem; margin-bottom: 10px;">BLACK GOLD EDITION</div>

    <!-- 結果顯示區 (置頂) -->
    <div id="result-container">
        <div id="result-title">等待分析指令...</div>
        <div id="result-content">
            請選擇下方功能進行運算。
        </div>
    </div>

    <!-- 版面切換 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('m6')">六合彩分析</button>
        <button class="tab-btn" onclick="switchTab('hr')">賽馬分析</button>
    </div>

    <!-- 六合彩版面 -->
    <div id="m6-section" class="content-section active">
        <div class="input-group">
            <label>輸入上期結果 (逗號分隔 6+1):</label>
            <input type="text" id="m6-last-result" placeholder="例: 1,8,19,25,33,40,12" value="">
            <button class="action-btn" style="min-height: 40px; width: auto; padding: 5px 20px;" onclick="lockAnalysis()">鎖定分析</button>
        </div>

        <div class="grid-buttons">
            <button class="action-btn" onclick="m6_chosenOne()">天選之子<span>1000條模擬選最強</span></button>
            <button class="action-btn" onclick="m6_luckyBoy()">運財童子<span>純運氣隨機</span></button>
            <button class="action-btn" onclick="m6_gann()">江恩指引<span>螺旋四方圖推演</span></button>
            <button class="action-btn" onclick="m6_smartLegs()">靈活玩腳<span>智能膽拖建議</span></button>
            <button class="action-btn" onclick="m6_deepSea()">深海尋寶<span>尋寶圖解碼</span></button>
            <button class="action-btn" onclick="m6_fanHeart()">凡事順心<span>范氏心臟病混沌法</span></button>
            <button class="action-btn" onclick="m6_zodiac()">黃道吉祥<span>中國日曆吉數</span></button>
            <button class="action-btn" onclick="m6_nothing()">無中生有<span>連續號變異</span></button>
            <button class="action-btn" onclick="m6_allIn()">全部預留<span>17注全包覆蓋</span></button>
            <button class="action-btn" onclick="m6_repeater()">功能10<span>重覆號碼預測</span></button>
        </div>
    </div>

    <!-- 賽馬版面 -->
    <div id="hr-section" class="content-section">
        <div class="sub-header">分析模式選擇 (1-14號 電腦運財)</div>
        <div class="grid-buttons">
            <button class="action-btn" onclick="hr_setMode('hot')">熱門熱食</button>
            <button class="action-btn" onclick="hr_setMode('value')">中間價值</button>
            <button class="action-btn" onclick="hr_setMode('cold')">爆冷之星</button>
            <button class="action-btn" onclick="hr_setMode('jockey')">騎師快選</button>
            <button class="action-btn" onclick="hr_setMode('lazy')">懶人心水</button>
            <button class="action-btn" onclick="hr_setMode('net')">網絡分析</button>
        </div>
        <br>
        <div class="sub-header">單場與過關建議</div>
        <div class="grid-buttons">
            <!-- 獨贏/位置 -->
            <button class="action-btn" onclick="hr_run('win')">馬王是你<span>獨贏 (第1名)</span></button>
            <button class="action-btn" onclick="hr_run('place')">前面位置<span>位置 (頭3名)</span></button>
            <button class="action-btn" onclick="hr_run('winplace')">快馬有名<span>獨贏及位置</span></button>
            
            <!-- 連贏/Q -->
            <button class="action-btn" onclick="hr_run('quinella')">快馬加鞭<span>連贏 (1-2名)</span></button>
            <button class="action-btn" onclick="hr_run('qpl')">QQ組合<span>位置Q (頭3的組合)</span></button>
            <button class="action-btn" onclick="hr_run('skewers')">大家串燒<span>連贏及位置Q</span></button>
            
            <!-- 多馬組合 -->
            <button class="action-btn" onclick="hr_run('quartet')">幸運順序<span>四重彩/按鈕</span></button>
            <button class="action-btn" onclick="hr_run('complex')">複式建議<span>二重/三重彩複式</span></button>
            <button class="action-btn" onclick="hr_run('first4')">運財四條<span>四連環 (任4)</span></button>
            
            <!-- 特殊彩池 -->
            <button class="action-btn" onclick="hr_run('trio')">三人成行<span>單T (3隻)</span></button>
            <button class="action-btn" onclick="hr_run('dtrio')">喜事成雙<span>孖T (兩口)</span></button>
            <button class="action-btn" onclick="hr_run('ttrio')">今次發達<span>3T (三口)</span></button>
            
            <!-- 過關 -->
            <button class="action-btn" onclick="hr_run('double')">一騎當千<span>孖寶/三寶</span></button>
            <button class="action-btn" onclick="hr_run('sixup')">六六大順<span>六環彩 (6場)</span></button>
            <button class="action-btn" style="grid-column: span 2; background: linear-gradient(145deg, #500, #200);" onclick="hr_parlay()">★ 綜合過關 ★<span>2串1 至 6串63</span></button>
        </div>
    </div>

    <script>
        // --- 通用工具 ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            
            if (tab === 'm6') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('m6-section').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('hr-section').classList.add('active');
            }
        }

        function displayResult(title, contentHTML) {
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-content').innerHTML = contentHTML;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getUniqueRandomNumbers(count, min, max, exclude = []) {
            let nums = new Set();
            let safety = 0;
            while (nums.size < count && safety < 1000) {
                let n = getRandomInt(min, max);
                if (!exclude.includes(n)) {
                    nums.add(n);
                }
                safety++;
            }
            return Array.from(nums).sort((a, b) => a - b);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- 六合彩邏輯 ---
        
        // 波色定義
        const balls = {
            red: [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
            blue: [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 47, 48],
            green: [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49]
        };

        function getBallHTML(num) {
            let color = 'blue';
            if (balls.red.includes(num)) color = 'red';
            if (balls.green.includes(num)) color = 'green';
            return `<span class="ball ${color}">${num}</span>`;
        }

        function formatM6(nums) {
            return nums.map(n => getBallHTML(n)).join(' ');
        }

        let lockedInput = [];

        function lockAnalysis() {
            const input = document.getElementById('m6-last-result').value;
            if (!input) {
                alert("請先輸入號碼！");
                return;
            }
            const parts = input.split(/[,， ]+/).map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n > 0 && n <= 49);
            if (parts.length < 6) {
                alert("請至少輸入6個有效號碼");
                return;
            }
            lockedInput = parts;
            displayResult("系統鎖定", `已鎖定上期號碼：<br>${formatM6(parts)}<br>接下來的分析將基於此數據。`);
        }

        // 1. 天選之子
        function m6_chosenOne() {
            let frequency = {};
            for(let i=0; i<1000; i++) {
                let ticket = getUniqueRandomNumbers(6, 1, 49);
                ticket.forEach(n => frequency[n] = (frequency[n] || 0) + 1);
            }
            let sorted = Object.keys(frequency).sort((a,b) => frequency[b] - frequency[a]);
            let top6 = sorted.slice(0, 6).map(n => parseInt(n)).sort((a,b)=>a-b);
            displayResult("天選之子 (1000次模擬)", formatM6(top6) + "<br><small>出現頻率最高的組合</small>");
        }

        // 2. 運財童子
        function m6_luckyBoy() {
            let nums = getUniqueRandomNumbers(6, 1, 49);
            displayResult("運財童子", formatM6(nums) + "<br><small>今日運財號碼</small>");
        }

        // 3. 江恩指引 (偽邏輯：基於上期總和與螺旋位移)
        function m6_gann() {
            if(lockedInput.length === 0) { displayResult("錯誤", "請先輸入上期號碼並鎖定"); return; }
            let seed = lockedInput.reduce((a,b)=>a+b, 0);
            let nextNums = [];
            for(let i=0; i<6; i++) {
                // 模擬螺旋計算
                let val = (seed + (i+1)*7) % 49; 
                if (val === 0) val = 49;
                while(nextNums.includes(val)) val = (val + 1) % 49 || 49;
                nextNums.push(val);
            }
            nextNums.sort((a,b)=>a-b);
            displayResult("江恩指引", formatM6(nextNums) + "<br><small>根據江恩螺旋四方圖毀滅運算</small>");
        }

        // 4. 靈活玩腳
        function m6_smartLegs() {
            let bankersCount = getRandomInt(1, 3); // 隨機1-3膽
            let bankers = getUniqueRandomNumbers(bankersCount, 1, 49);
            let legsCount = getRandomInt(4, 10); // 隨機腳
            let legs = getUniqueRandomNumbers(legsCount, 1, 49, bankers);
            
            let html = `<strong>膽 (${bankersCount}):</strong><br>${formatM6(bankers)}<br>`;
            html += `<strong>配腳 (${legsCount}):</strong><br>${formatM6(legs)}`;
            displayResult("靈活玩腳 (智能建議)", html);
        }

        // 5. 深海尋寶 (偽邏輯：號碼鏡像與補數)
        function m6_deepSea() {
            if(lockedInput.length === 0) { displayResult("錯誤", "請先輸入上期號碼並鎖定"); return; }
            let treasure = lockedInput.map(n => {
                let t = 50 - n; // 簡單補數尋寶
                return t;
            }).sort((a,b)=>a-b);
            displayResult("深海尋寶", formatM6(treasure) + "<br><small>尋寶圖解碼位置</small>");
        }

        // 6. 凡事順心 (范氏心臟病 - 混沌亂數)
        function m6_fanHeart() {
             if(lockedInput.length === 0) { displayResult("錯誤", "請先輸入上期號碼並鎖定"); return; }
             // 模擬高壓心跳：大幅度跳動
             let heart = [];
             lockedInput.forEach(n => {
                 let chaos = (n * 3 + 7) % 49 || 49;
                 if(!heart.includes(chaos)) heart.push(chaos);
             });
             // 補足6個
             while(heart.length < 6) {
                 let r = getRandomInt(1, 49);
                 if(!heart.includes(r)) heart.push(r);
             }
             heart.sort((a,b)=>a-b);
             displayResult("凡事順心 (范氏心臟病)", formatM6(heart) + "<br><small>混沌理論推演</small>");
        }

        // 7. 黃道吉祥
        function m6_zodiac() {
            let d = new Date();
            let luckySeed = d.getDate() + d.getMonth() + 1;
            let nums = [];
            for(let i=0; i<6; i++) {
                let val = (luckySeed * (i+2)) % 49 || 49;
                while(nums.includes(val)) val = (val + 1) % 49 || 49;
                nums.push(val);
            }
            nums.sort((a,b)=>a-b);
            displayResult("黃道吉祥", formatM6(nums) + "<br><small>依今日中國黃曆吉時運算</small>");
        }

        // 8. 無中生有 (連續號變異)
        function m6_nothing() {
            // 基礎產生一組連續號較多的組合
            let base = getRandomInt(1, 40);
            let nums = [base, base+1, base+2]; // 強制三連
            while(nums.length < 6) {
                let r = getRandomInt(1, 49);
                if(!nums.includes(r)) nums.push(r);
            }
            nums.sort((a,b)=>a-b);
            displayResult("無中生有", formatM6(nums) + "<br><small>基於連續號碼變異產生</small>");
        }

        // 9. 全部預留 (17注全包)
        function m6_allIn() {
            let allNums = Array.from({length: 49}, (_, i) => i + 1);
            allNums = shuffleArray(allNums); // 洗牌
            
            // 前8注：每注6個不重複，消耗 6*8 = 48 個號碼
            let bets = [];
            for(let i=0; i<8; i++) {
                let bet = allNums.slice(i*6, (i+1)*6).sort((a,b)=>a-b);
                bets.push(bet);
            }
            
            // 第9注：剩下第49個號碼 + 隨機5個
            let lastNum = allNums[48];
            let extraFor9 = getUniqueRandomNumbers(5, 1, 49, [lastNum]);
            let bet9 = [lastNum, ...extraFor9].sort((a,b)=>a-b);
            bets.push(bet9);

            // 第10-17注：完全隨機覆蓋
            for(let i=0; i<8; i++) {
                bets.push(getUniqueRandomNumbers(6, 1, 49));
            }

            let html = `<div style="text-align:left; max-height:300px; overflow-y:auto; padding-left:20px;">`;
            bets.forEach((bet, idx) => {
                html += `<div><strong>注 ${idx+1}:</strong> ${formatM6(bet)}</div>`;
            });
            html += `</div>`;

            displayResult("全部預留 (17注全包)", html + "<small>號碼全覆蓋策略</small>");
        }

        // 10. 重覆法
        function m6_repeater() {
            if(lockedInput.length === 0) { displayResult("錯誤", "請先輸入上期號碼並鎖定"); return; }
            let pool = [...lockedInput];
            pool = shuffleArray(pool);
            let repeats = pool.slice(0, 2).sort((a,b)=>a-b);
            displayResult("功能10 (重覆法)", formatM6(repeats) + "<br><small>下期極可能重複之號碼</small>");
        }


        // --- 賽馬邏輯 ---
        let hrMode = "hot"; // default

        function hr_setMode(mode) {
            hrMode = mode;
            let names = {
                hot: "熱門熱食", value: "中間價值", cold: "爆冷之星", 
                jockey: "騎師快選", lazy: "懶人心水", net: "網絡分析"
            };
            displayResult("賽馬模式切換", `已選擇：<span style="color:var(--gold); font-weight:bold;">${names[mode]}</span><br>接下來的分析將以此邏輯進行。`);
        }

        function getHorseHTML(nums) {
            if(!Array.isArray(nums)) nums = [nums];
            return nums.map(n => `<span class="horse-icon">🐴 ${n}</span>`).join(' ');
        }

        function hr_generate(count, allowDupesInSet = false) {
            // 賽馬 1-14 號
            return getUniqueRandomNumbers(count, 1, 14);
        }

        function hr_run(type) {
            let html = "";
            let title = "";
            let h1, h2, h3, h4;

            switch(type) {
                case 'win':
                    h1 = hr_generate(1)[0];
                    title = "馬王是你 (獨贏)";
                    html = `第1名推薦：${getHorseHTML(h1)}`;
                    break;
                case 'place':
                    h1 = hr_generate(3);
                    title = "前面位置 (位置)";
                    html = `三甲推薦：${getHorseHTML(h1)}`;
                    break;
                case 'winplace':
                    h1 = hr_generate(3);
                    title = "快馬有名 (獨贏及位置)";
                    html = `精選：${getHorseHTML(h1)}<br><small>建議注項：1W 3P</small>`;
                    break;
                case 'quinella':
                    h1 = hr_generate(2);
                    title = "快馬加鞭 (連贏)";
                    html = `Q膽：${getHorseHTML(h1)}`;
                    break;
                case 'qpl':
                    h1 = hr_generate(3); // 3隻互串
                    title = "QQ組合 (位置Q)";
                    html = `互串組合：${getHorseHTML(h1)}<br><small>3對組合</small>`;
                    break;
                case 'skewers':
                    h1 = hr_generate(2); // 膽
                    h2 = hr_generate(3, 1, 14, h1); // 腳
                    title = "大家串燒 (連贏及位置Q)";
                    html = `膽：${getHorseHTML(h1)} <br> 拖：${getHorseHTML(h2)}`;
                    break;
                case 'quartet':
                    h1 = hr_generate(4);
                    title = "幸運順序 (按鈕/四重彩)";
                    html = `前四名推薦：${getHorseHTML(h1)}`;
                    break;
                case 'complex':
                    h1 = hr_generate(2);
                    h2 = hr_generate(3);
                    title = "複式建議";
                    html = `二重彩複式：${getHorseHTML(h1)}<br>三重彩複式：${getHorseHTML(h2)}`;
                    break;
                case 'first4':
                    h1 = hr_generate(4);
                    title = "運財四條 (四連環)";
                    html = `順序/複式：${getHorseHTML(h1)}`;
                    break;
                case 'trio':
                    h1 = hr_generate(3);
                    title = "三人成行 (單T)";
                    html = `單T組合：${getHorseHTML(h1)}`;
                    break;
                case 'dtrio':
                    h1 = hr_generate(3);
                    h2 = hr_generate(3);
                    title = "喜事成雙 (孖T)";
                    html = `第一口：${getHorseHTML(h1)}<br>第二口：${getHorseHTML(h2)}`;
                    break;
                case 'ttrio':
                    h1 = hr_generate(3);
                    h2 = hr_generate(3);
                    h3 = hr_generate(3);
                    title = "今次發達 (3T)";
                    html = `第一口：${getHorseHTML(h1)}<br>第二口：${getHorseHTML(h2)}<br>第三口：${getHorseHTML(h3)}`;
                    break;
                case 'double':
                    h1 = hr_generate(1);
                    h2 = hr_generate(1);
                    title = "一騎當千 (孖寶/三寶)";
                    html = `第一場首選：${getHorseHTML(h1)}<br>第二場首選：${getHorseHTML(h2)}`;
                    break;
                case 'sixup':
                    h1 = [];
                    for(let i=0; i<6; i++) h1.push(getRandomInt(1,14));
                    title = "六六大順 (六環彩)";
                    html = `六場首選：${getHorseHTML(h1)}`;
                    break;
            }
            displayResult(title, html);
        }

        function hr_parlay() {
            // 綜合過關邏輯
            let races = [];
            for(let i=1; i<=6; i++) {
                let w = getRandomInt(1, 14);
                let p = getRandomInt(1, 14); 
                while(p === w) p = getRandomInt(1, 14);
                races.push({ r: i, w: w, p: p });
            }

            let html = `<div style="text-align:left; font-size:0.9rem;">`;
            html += `<strong style="color:var(--gold);">過關場次建議 (各區不重複):</strong><br>`;
            
            races.forEach(race => {
                html += `<div class="race-tag">第 ${race.r} 場</div>`;
                html += `獨贏: ${getHorseHTML(race.w)} | 位置: ${getHorseHTML(race.p)}<br>`;
            });

            html += `<br><strong style="color:#fff; border-top:1px solid #555; padding-top:5px; display:block;">混合過關語音清單:</strong>`;
            html += `<ul style="list-style:none; padding-left:0; color:#aaa;">`;
            html += `<li>🔊 2串3 (第1,2場 獨贏及位置)</li>`;
            html += `<li>🔊 3串7 (第1,3,4場 獨贏及連贏)</li>`;
            html += `<li>🔊 4串15 (第1,2,5,6場 混合過關)</li>`;
            html += `<li>🔊 6串63 (全場次 位置Q串射)</li>`;
            html += `</ul>`;
            html += `</div>`;

            displayResult("綜合過關 (Mixed Parlay)", html);
        }

    </script>
